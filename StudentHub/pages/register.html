<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>StudentHub | Register</title>
</head>
<body>
    <header class="site-header">

    <div class="nav-container">

        <a href="index.html" class="brand">
            <img
                src="../images/logo.png"
                alt="StudentHub Logo"
                class="brand-logo"
            >
            <span class="brand-name">StudentHub</span>
        </a>

        <nav class="main-navigation" aria-label="Main Navigation">

            <ul class="nav-list">

                <li>
                    <a href="index.html" class="nav-link">
                        Home
                    </a>
                </li>

                <li>
                    <a href="about.html" class="nav-link">
                        About
                    </a>
                </li>

                <li>
                    <a href="academics.html" class="nav-link">
                        Academics
                    </a>
                </li>

                <li>
                    <a href="attendance.html" class="nav-link">
                        Attendance
                    </a>
                </li>

                <li>
                    <a href="communication.html" class="nav-link">
                        Communication
                    </a>
                </li>

                <li>
                    <a href="contact.html" class="nav-link">
                        Contact
                    </a>
                </li>

            </ul>

        </nav>

        <div class="nav-actions">

            <a href="login.html" class="nav-login">
                Login
            </a>

            <a href="register.html" class="nav-register">
                Register
            </a>

        </div>

    </div>

</header>

    <main>
        <section>
            <h2>Registration Form</h2>
            <form action="#">
                <label for="full-name">Full Name</label>
                <input type="text" id="full-name" name="full-name">

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email">

                <label for="role">Role</label>
                <select id="role" name="role">
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                    <option value="admin">Administrator</option>
                </select>

                <label for="department">Department</label>
                <input type="text" id="department" name="department">

                <label for="password">Password</label>
                <input type="password" id="password" name="password">

                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password">

                <label><input type="checkbox" name="agree"> I agree to the terms and conditions.</label>

                <button type="submit">Register</button>
            </form>
            <p>Already registered? <a href="login.html">Sign in</a>.</p>
        </section>
    </main>

    <footer>
        <p>Welcome to StudentHub.</p>
    </footer>
</body>
</html>
