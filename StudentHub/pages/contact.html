<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>StudentHub | Contact</title>
</head>

<body>
    <header class="site-header">

        <div class="nav-container">

            <a href="index.html" class="brand">
                <img src="../images/logo.png" alt="StudentHub Logo" class="brand-logo">
                <span class="brand-name">StudentHub</span>
            </a>

            <nav class="main-navigation" aria-label="Main Navigation">

                <ul class="nav-list">

                    <li>
                        <a href="index.html" class="nav-link">
                            Home
                        </a>
                    </li>

                    <li>
                        <a href="about.html" class="nav-link">
                            About
                        </a>
                    </li>

                    <li>
                        <a href="academics.html" class="nav-link">
                            Academics
                        </a>
                    </li>

                    <li>
                        <a href="attendance.html" class="nav-link">
                            Attendance
                        </a>
                    </li>

                    <li>
                        <a href="communication.html" class="nav-link">
                            Communication
                        </a>
                    </li>

                    <li>
                        <a href="contact.html" class="nav-link active">
                            Contact
                        </a>
                    </li>

                </ul>

            </nav>

            <div class="nav-actions">

                <a href="login.html" class="nav-login">
                    Login
                </a>

                <a href="register.html" class="nav-register">
                    Register
                </a>

            </div>

        </div>

    </header>

    <main>
        <section>
            <h2>Get in Touch</h2>
            <p>StudentHub Support Office</p>
            <p>123 Campus Road, New City</p>
            <p>Email: support@studenthub.edu</p>
            <p>Phone: +91 98765 43210</p>
        </section>

        <section>
            <h2>Send a Message</h2>
            <form action="#">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name">

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email">

                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject">

                <label for="message">Your Message</label>
                <textarea id="message" name="message" rows="5"></textarea>

                <button type="submit">Send</button>
            </form>
        </section>
    </main>

    <footer>
        <p>We will respond within 24 hours.</p>
    </footer>
</body>

</html>
